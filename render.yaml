services:
  - type: web
    name: thapar-pg-finder
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
